[package]
name = "discord-viewer"
version = "0.1.0"
edition = "2024"
description = "Browse, search and view media from a DiscordChatExporter JSON export"

[dependencies]
eframe = "0.37"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
resvg = "0.45"
imagesize = "0.14"
rodio = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
open = "5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
